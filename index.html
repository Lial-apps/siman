*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:15px/1.5 "Segoe UI","Rubik",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap;position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:22px;font-weight:700;letter-spacing:-.01em;background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 92%,transparent 92%);padding:0 3px;color:#1C2333}
.fname{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.tools{display:flex;gap:2px;margin-inline:auto;overflow-x:auto;scrollbar-width:none}
.tool{border:0;background:none;padding:6px 10px 9px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;min-width:54px}
.tool svg{width:22px;height:22px}
.tool span{font-size:12px;color:var(--muted)}
.tool:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.tool[aria-pressed="true"] span{color:var(--ink);font-weight:500}
.tool[aria-pressed="true"]::after{content:"";position:absolute;inset-inline:12px;bottom:3px;height:5px;border-radius:3px;background:var(--marker);transform:skewX(-12deg)}
.tool:disabled{opacity:.35;cursor:default}
.group{display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line);background:var(--bar);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--bar);border-radius:6px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center;font-size:18px}
.zoomval{min-width:4.2ch;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}

/* ---------- options strip ---------- */
.opts{background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:6px 14px;font-size:13px;color:var(--muted);min-height:40px;flex-wrap:wrap}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--bar);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.opts input[type=range]{width:110px;accent-color:var(--blue)}
.pageinfo{margin-inline-start:auto;font-variant-numeric:tabular-nums}

/* ---------- workspace ---------- */
.desk{flex:1;overflow:auto;position:relative;padding:24px 12px 60px;-webkit-overflow-scrolling:touch}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px;width:max-content;min-width:100%}
.page{position:relative;background:#fff;box-shadow:var(--shadow);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ann{position:absolute;inset:0;direction:ltr}
.ann svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ann path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.hl{position:absolute;mix-blend-mode:multiply;opacity:.42;border-radius:1px}
.tw{position:absolute}
.tx{font-family:"AlefEmbed",Arial,sans-serif;line-height:1.35;padding:0;margin:0;white-space:pre-wrap;word-break:break-word;outline:1px dashed transparent;min-height:1.35em;resize:horizontal;overflow:hidden;min-width:30px;caret-color:var(--blue);unicode-bidi:plaintext;text-align:start}
.tw:hover .tx,.tx:focus{outline-color:var(--blue)}
.grip{position:absolute;top:-24px;inset-inline-start:0;height:20px;padding:0 6px;border-radius:4px 4px 0 0;background:var(--blue);color:#fff;font-size:11px;line-height:20px;cursor:move;opacity:0;touch-action:none;user-select:none;direction:rtl;white-space:nowrap}
.tw:hover .grip,.tw:focus-within .grip{opacity:1}

/* pointer behaviour per tool */
body[data-tool="select"] .ann{pointer-events:none}
body[data-tool="select"] .tw{pointer-events:auto}
body[data-tool="text"] .ann{pointer-events:auto;cursor:text}
body[data-tool="highlight"] .ann,body[data-tool="pen"] .ann{pointer-events:auto;cursor:crosshair;touch-action:none}
body[data-tool="highlight"] .tw,body[data-tool="pen"] .tw{pointer-events:none}
body[data-tool="eraser"] .ann{pointer-events:auto;cursor:cell;touch-action:none}
body[data-tool="eraser"] .ann path{pointer-events:stroke}
body[data-tool="eraser"] .tx{pointer-events:none}
body[data-tool="eraser"] .tw:hover,body[data-tool="eraser"] .hl:hover{filter:drop-shadow(0 0 2px var(--danger))}
body[data-tool="eraser"] .ann path:hover{stroke:var(--danger)}

/* ---------- empty state ---------- */
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.drop{width:min(460px,100%);aspect-ratio:1/1.25;background:var(--bar);border:2px dashed var(--line);border-radius:4px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center;padding:32px;box-shadow:var(--shadow)}
.drop h1{font-size:28px;line-height:1.2;margin:0;font-weight:700}
.drop h1 mark{background:linear-gradient(transparent 55%,var(--marker) 55%,var(--marker) 90%,transparent 90%);color:inherit}
.drop p{margin:0;color:var(--muted);max-width:30ch}
body.dragging .drop{border-color:var(--blue);border-style:solid}
.hidden{display:none!important}

/* ---------- pages panel ---------- */
.pgpanel{width:190px;flex:none;background:var(--bar);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pg-tools{padding:10px;border-bottom:1px solid var(--line)}
.pg-tools .btn{width:100%}
.thumbs{list-style:none;margin:0;padding:10px 12px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:6px}
.thumb .tc{background:#fff;box-shadow:var(--shadow);cursor:pointer;line-height:0;outline:2px solid transparent;outline-offset:2px}
.thumb.cur .tc{outline-color:var(--blue)}
.thumb canvas{display:block;max-width:130px;height:auto}
.thumb .tl{font-size:12px;color:var(--muted)}
.thumb .ta{display:flex;gap:3px}
.thumb .ta button{width:28px;height:26px;border:1px solid var(--line);background:var(--bar);border-radius:5px;cursor:pointer;font-size:14px;line-height:1;padding:0}
.thumb .ta button:hover{border-color:var(--muted)}
.thumb .ta button:disabled{opacity:.3;cursor:default}
.thumb .ta .del:hover{border-color:var(--danger);color:var(--danger)}
.btn.install{border-color:var(--marker);background:var(--marker);color:#1C2333;font-weight:500}
.ios-hint{font-size:13px}
@media (max-width:720px){.wide-only{display:none}.pgpanel{position:fixed;inset:auto 0 0 0;width:100%;height:46vh;border:0;border-top:1px solid var(--line);z-index:10;box-shadow:var(--shadow)}
  .thumbs{flex-direction:row;overflow-x:auto;align-items:flex-start}}

/* ---------- translation panel ---------- */
.work{flex:1;display:flex;min-height:0}
.work .desk{flex:1}
.tpanel{width:min(420px,42vw);background:var(--bar);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tp-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tp-head h2{font-size:17px;margin:0;margin-inline-end:auto;font-weight:700}
.tp-settings,.tp-main{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.tp-settings p{margin:0;font-size:13px;color:var(--muted)}
.tp-settings a{color:var(--blue)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:14px;color:var(--ink);background:var(--bar);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.tp-lang{margin:0;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.segb,.segp{flex:1;border:0;background:none;padding:7px;cursor:pointer}
.segb[aria-pressed="true"],.segp[aria-pressed="true"]{background:var(--ink);color:var(--bar);font-weight:500}
.tp-actions{display:flex;gap:8px}
.tp-status{margin:0;font-size:13px;color:var(--muted);min-height:1.5em}
.tp-status.err{color:var(--danger)}
.tp-results{flex:1;overflow:auto;padding:6px 14px 14px}
.tp-page{padding:12px 0;border-bottom:1px solid var(--line)}
.tp-page h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:500;cursor:pointer}
.tp-page h3:hover{color:var(--blue)}
.tp-page .tt{white-space:pre-wrap;font-size:15px;line-height:1.65;unicode-bidi:plaintext;text-align:start;user-select:text}
.tp-page .tt.wait{color:var(--muted);font-style:italic}
.tp-page .tt.err{color:var(--danger)}
.tp-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
@media (max-width:720px){.tpanel{position:fixed;inset:auto 0 0 0;width:100%;height:70vh;border-inline-start:0;border-top:1px solid var(--line);z-index:10;box-shadow:var(--shadow)}}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bar);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
.toast.show{opacity:1}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.15);display:grid;place-items:center;z-index:30}
.busy div{background:var(--bar);padding:14px 22px;border-radius:8px;box-shadow:var(--shadow)}

@media (max-width:720px){
  .bar{padding:6px 8px;gap:6px}
  .tools{order:3;width:100%;margin:0;justify-content:space-between}
  .fname{display:none}
  .group.zoom .zoomval{display:none}
  .desk{padding:12px 6px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-tool="select">

<header class="bar">
  <div class="brand"><b>סימן</b><span class="fname" id="fname"></span></div>

  <nav class="tools" id="tools" aria-label="כלים">
    <button class="tool" data-tool="select" aria-pressed="true" title="בחירה וגלילה (V)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3l12 9-5.5 1.2L15.5 20l-2.6 1.1-3-6.8L6 18z" stroke-linejoin="round"/></svg><span>בחירה</span></button>
    <button class="tool" data-tool="text" aria-pressed="false" title="הוספת טקסט (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6V4h14v2M12 4v16M9 20h6" stroke-linecap="round"/></svg><span>טקסט</span></button>
    <button class="tool" data-tool="highlight" aria-pressed="false" title="מרקר (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 4l6 6-8 8H6v-6z" stroke-linejoin="round"/><path d="M4 21h9" stroke-linecap="round"/></svg><span>מרקר</span></button>
    <button class="tool" data-tool="pen" aria-pressed="false" title="עט (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20c3-1 4-4 7-4s3 3 6 2 3-5 3-5" stroke-linecap="round"/><path d="M16 4l4 4-7 7-4 1 1-4z" stroke-linejoin="round"/></svg><span>עט</span></button>
    <button class="tool" data-tool="eraser" aria-pressed="false" title="מחק (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 20h12M5 15l9-9 5 5-8 8H8z" stroke-linejoin="round" stroke-linecap="round"/></svg><span>מחק</span></button>
  </nav>

    <button class="btn" id="fitW" title="התאמה לרוחב">רוחב</button>
  </div>
  <div class="group">
    <button class="icon-btn" id="undo" title="ביטול (Ctrl+Z)" aria-label="ביטול">↶</button>
    <button class="btn" id="pgBtn" disabled title="ניהול עמודים">עמודים</button>
    <button class="btn" id="trBtn" disabled title="תרגום המסמך">תרגום</button>
    <button class="btn" id="openBtn">פתיחה</button>
    <button class="btn wide-only" id="saveAsBtn" disabled title="שמירה בשם (Ctrl+Shift+S)">שמירה בשם</button>
    <button class="btn primary" id="saveBtn" disabled title="Ctrl+S">שמירה</button>
    <button class="btn install hidden" id="installBtn" title="התקנת האפליקציה במכשיר">התקנה</button>
  </div>
  <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  <input type="file" id="mergeFile" accept="application/pdf,.pdf" hidden multiple>
</header>

<div class="opts" id="opts">
  <span id="optLabel">בחרו כלי כדי לסמן על המסמך</span>
  <div class="swatches hidden" id="swatches"></div>
  <label class="hidden" id="sizeWrap"><span id="sizeLabel">גודל</span>
    <input type="range" id="size" min="6" max="48" step="1"> <span id="sizeVal"></span></label>
  <span class="pageinfo" id="pageInfo"></span>
</div>

<div class="work">
<aside class="pgpanel hidden" id="pgpanel" aria-label="עמודים">
  <div class="tp-head">
    <h2>עמודים</h2>
    <button class="icon-btn" id="pgClose" title="סגירה" aria-label="סגירת חלונית העמודים">×</button>
  </div>
  <div class="pg-tools">
    <button class="btn" id="mergeBtn">הוספת PDF לסוף</button>
  </div>
  <ol class="thumbs" id="thumbs"></ol>
</aside>
<main class="desk" id="desk">
  <div class="empty" id="empty">
    <div class="drop">
      <h1>גררו לכאן <mark>קובץ PDF</mark></h1>
      <p>קוראים, מסמנים, כותבים בעברית ושומרים. הקובץ לא יוצא מהמחשב שלכם.</p>
      <button class="btn primary" id="openBtn2">בחירת קובץ</button>
      <p class="ios-hint hidden" id="iosHint">להתקנה באייפון: לוחצים על "שיתוף" ב-Safari ואז "הוסף למסך הבית".</p>
    </div>
  </div>
  <div class="pages" id="pages"></div>
</main>

<aside class="tpanel hidden" id="tpanel" aria-label="תרגום">
  <div class="tp-head">
    <h2>תרגום המסמך</h2>
    <button class="icon-btn" id="tpSettingsBtn" title="הגדרות תרגום" aria-label="הגדרות תרגום">⚙</button>
    <button class="icon-btn" id="tpClose" title="סגירה" aria-label="סגירת חלונית התרגום">×</button>
  </div>

  <section class="tp-settings hidden" id="tpSettings">
    <div class="seg" role="group" aria-label="שירות תרגום">
      <button class="segp" data-provider="gemini" aria-pressed="true">Gemini · חינם</button>
      <button class="segp" data-provider="claude" aria-pressed="false">Claude · בתשלום</button>
    </div>
    <p id="tpHelp"></p>
    <label class="field">מפתח API
      <input type="password" id="tpKey" autocomplete="off" dir="ltr"></label>
    <label class="field">מודל
      <select id="tpModel"></select></label>
    <button class="btn primary" id="tpSaveKey">שמירה</button>
  </section>

  <section class="tp-main" id="tpMain">
    <p class="tp-lang">שפת המסמך: <b id="tpLang">בודק…</b></p>
    <div class="seg" role="group" aria-label="שפת יעד">
      <button class="segb" data-target="he" aria-pressed="true">לעברית</button>
      <button class="segb" data-target="en" aria-pressed="false">לאנגלית</button>
    </div>
    <label class="field">היקף
      <select id="tpScope"><option value="all">כל המסמך</option><option value="cur">העמוד הנוכחי</option></select></label>
    <div class="tp-actions">
      <button class="btn primary" id="tpGo">תרגום</button>
      <button class="btn hidden" id="tpStop">עצירה</button>
    </div>
    <p class="tp-status" id="tpStatus" role="status"></p>
  </section>

  <div class="tp-results" id="tpResults"></div>

  <div class="tp-foot hidden" id="tpFoot">
    <button class="btn primary" id="tpPdf">שמירת התרגום כ-PDF</button>
    <button class="btn" id="tpTxt">שמירה כטקסט</button>
    <button class="btn" id="tpCopy">העתקה</button>
  </div>
</aside>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="busy hidden" id="busy"><div id="busyMsg">רגע…</div></div>

    res[i]=(p&&p===n)?p:base;
  }
  const runs=[];
  for(let i=0;i<ch.length;i++){
    const last=runs[runs.length-1];
    if(last&&last.dir===res[i]) last.text+=ch[i]; else runs.push({dir:res[i],text:ch[i]});
  }
  return {base,runs:base==='R'?runs.reverse():runs};
}
function runForPdf(run){
  if(run.dir!=='R') return run.text;
  const mir=[...run.text].map(c=>MIRROR[c]||c).join('');
  return RE_R.test(mir)?mir:[...mir].reverse().join('');
}

const pdfjs=window.pdfjsLib||window['pdfjs-dist/build/pdf'];

/* ===================== ui helpers ===================== */
let toastT;

function busy(on,msg){$('busy').classList.toggle('hidden',!on);if(msg)$('busyMsg').textContent=msg;}

/* ===================== open ===================== */
async function openFile(file,handle){
  if(!file)return;
  if(S.dirty&&!confirm('יש שינויים שלא נשמרו. לפתוח קובץ אחר בכל זאת?'))return;
  if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf'){toast('אפשר לפתוח רק קובצי PDF');return;}
  busy(true,'פותח את הקובץ…');
  try{
    const bytes=new Uint8Array(await file.arrayBuffer());
    const doc=await pdfjs.getDocument({data:bytes.slice(),isEvalSupported:false}).promise;
    if(S.doc)S.doc.destroy();
    Object.assign(S,{bytes,name:file.name,doc,anns:[],hist:[],redo:[],nextId:1,handle:handle||null});
    setDirty(false);
    $('fname').textContent=file.name;
    $('empty').classList.add('hidden');
    ['saveBtn','saveAsBtn','trBtn','pgBtn'].forEach(id=>$(id).disabled=false);
    TR.reset();
    await buildPages();
    fitWidth();
    if(!$('tpanel').classList.contains('hidden'))detect();
    if(!$('pgpanel').classList.contains('hidden'))renderThumbs();
  }catch(e){
    console.error(e);
    toast(e&&e.name==='PasswordException'?'הקובץ מוגן בסיסמה. הסירו את הסיסמה ונסו שוב.':'לא הצלחתי לפתוח את הקובץ. ייתכן שהוא פגום.');
  }finally{busy(false);}
}

/* ===================== pages ===================== */
let io;
async function buildPages(){
  const wrap=$('pages');wrap.innerHTML='';S.pages=[];
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)renderPage(S.pages[+e.target.dataset.i]);}),{root:$('desk'),rootMargin:'800px 0px'});
  for(let i=1;i<=S.doc.numPages;i++){
    const page=await S.doc.getPage(i);
    const el=document.createElement('div');el.className='page';el.dataset.i=i-1;
    const canvas=document.createElement('canvas');
    const ann=document.createElement('div');ann.className='ann';
    const hl=document.createElement('div');
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    const tl=document.createElement('div');
    ann.append(hl,svg,tl);el.append(canvas,ann);wrap.append(el);
    const P={i,page,el,canvas,ann,hl,svg,tl,vp:null,renderedAt:0,task:null};
    S.pages.push(P);bindAnnEvents(P);
  }
  layout();
}
function layout(){
  for(const P of S.pages){
    P.vp=P.page.getViewport({scale:S.zoom});
    P.el.style.width=P.vp.width+'px';P.el.style.height=P.vp.height+'px';
    P.renderedAt=0;
    io.unobserve(P.el);io.observe(P.el);
    drawAnns(P);
  }
  $('zoomVal').textContent=Math.round(S.zoom*100)+'%';
  updatePageInfo();
}
async function renderPage(P){
  if(!P||P.renderedAt===S.zoom)return;
  const z=S.zoom;P.renderedAt=z;
  if(P.task){try{P.task.cancel();}catch(_){}}
  const vp=P.page.getViewport({scale:z*dpr()});
  const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
  P.task=P.page.render({canvasContext:c.getContext('2d'),viewport:vp});
  try{await P.task.promise;}catch(e){if(e&&e.name==='RenderingCancelledException')return;console.error(e);return;}
  if(S.zoom!==z)return;
  c.className='';P.canvas.replaceWith(c);P.canvas=c;
}
function setZoom(z,keepCenter=true){
  z=Math.max(.25,Math.min(5,z));if(Math.abs(z-S.zoom)<.001)return;
  const d=$('desk');const ry=(d.scrollTop+d.clientHeight/2)/Math.max(1,d.scrollHeight);
  const rx=(d.scrollLeft+d.clientWidth/2)/Math.max(1,d.scrollWidth);
  S.zoom=z;layout();
  if(keepCenter){d.scrollTop=ry*d.scrollHeight-d.clientHeight/2;d.scrollLeft=rx*d.scrollWidth-d.clientWidth/2;}
}
function fitWidth(){
  if(!S.pages.length)return;
  const w=S.pages[0].page.getViewport({scale:1}).width;
  const avail=$('desk').clientWidth-(innerWidth<720?14:48);
  setZoom(Math.min(2,avail/w),false);
}
function updatePageInfo(){
  if(!S.pages.length){$('pageInfo').textContent='';return;}
  const d=$('desk'),mid=d.getBoundingClientRect().top+d.clientHeight/2;
  let best=0,bd=1e9;
  S.pages.forEach((P,k)=>{const r=P.el.getBoundingClientRect();const dd=Math.abs((r.top+r.bottom)/2-mid);if(dd<bd){bd=dd;best=k;}});
  $('pageInfo').textContent=`עמוד ${best+1} מתוך ${S.pages.length}`;
}

/* ===================== coordinates ===================== */
const toPdf=(P,x,y)=>P.vp.convertToPdfPoint(x,y);
const toCss=(P,x,y)=>P.vp.convertToViewportPoint(x,y);
function localXY(P,e){const r=P.ann.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}

/* ===================== annotations ===================== */
function snapshot(){S.hist.push(JSON.stringify(S.anns));if(S.hist.length>200)S.hist.shift();S.redo=[];setDirty(true);}
function undo(){
  if(!S.hist.length){toast('אין מה לבטל');return;}
  S.redo.push(JSON.stringify(S.anns));S.anns=JSON.parse(S.hist.pop());S.pages.forEach(drawAnns);setDirty(true);
}
function redoAct(){if(!S.redo.length)return;S.hist.push(JSON.stringify(S.anns));S.anns=JSON.parse(S.redo.pop());S.pages.forEach(drawAnns);}
function removeAnn(id){const k=S.anns.findIndex(a=>a.id===id);if(k<0)return;snapshot();const a=S.anns.splice(k,1)[0];drawAnns(S.pages[a.page]);}
const pageOf=a=>S.pages[a.page];

function drawAnns(P){
  P.hl.innerHTML='';P.svg.innerHTML='';P.tl.innerHTML='';
  for(const a of S.anns){if(a.page!==P.i-1)continue;
    if(a.type==='hl')P.hl.append(hlEl(P,a));
    else if(a.type==='ink')P.svg.append(inkEl(P,a));

}
function hlEl(P,a){
  const[x1,y1]=toCss(P,a.x1,a.y1),[x2,y2]=toCss(P,a.x2,a.y2);
  const d=document.createElement('div');d.className='hl';d.dataset.id=a.id;
  Object.assign(d.style,{left:Math.min(x1,x2)+'px',top:Math.min(y1,y2)+'px',width:Math.abs(x2-x1)+'px',height:Math.abs(y2-y1)+'px',background:a.color});
  return d;
}
function inkPath(P,pts){return pts.map((p,k)=>{const[x,y]=toCss(P,p[0],p[1]);return(k?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ')+(pts.length===1?' l0.1 0':'');}
function inkEl(P,a){
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',inkPath(P,a.pts));p.setAttribute('stroke',a.color);p.setAttribute('stroke-width',a.w*S.zoom);p.dataset.id=a.id;
  return p;
}
function textEl(P,a){
  const[l,t]=toCss(P,a.x,a.y);
  const w=document.createElement('div');w.className='tw';w.dataset.id=a.id;
  w.style.left=l+'px';w.style.top=t+'px';
  const grip=document.createElement('div');grip.className='grip';grip.textContent='⠿ גרירה';
  const tx=document.createElement('div');tx.className='tx';tx.dir='auto';tx.spellcheck=false;
  try{tx.contentEditable='plaintext-only';}catch(_){tx.contentEditable='true';}
  if(tx.contentEditable!=='plaintext-only')tx.contentEditable='true';
  tx.style.width=a.w*S.zoom+'px';tx.style.fontSize=a.size*S.zoom+'px';tx.style.color=a.color;
  tx.textContent=a.text;
  let before=null;
  tx.addEventListener('focus',()=>{before=JSON.stringify(S.anns);S.lastText=a.id;if(S.tool==='text'||S.tool==='select'){S.color.text=a.color;}});
  tx.addEventListener('input',()=>{a.text=tx.innerText.replace(/\n$/,'');setDirty(true);});
  tx.addEventListener('blur',()=>{
    if(!a.text.trim()){const k=S.anns.indexOf(a);if(k>=0){S.anns.splice(k,1);w.remove();}return;}
    if(before&&before!==JSON.stringify(S.anns)){S.hist.push(before);S.redo=[];}
  });
  tx.addEventListener('keydown',e=>{if(e.key==='Escape')tx.blur();});
  new ResizeObserver(()=>{if(tx.offsetWidth)a.w=tx.offsetWidth/S.zoom;}).observe(tx);
  // drag
  grip.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();grip.setPointerCapture(e.pointerId);snapshot();
    const[sx,sy]=localXY(P,e);const ox=parseFloat(w.style.left),oy=parseFloat(w.style.top);
    const mv=ev=>{const[cx,cy]=localXY(P,ev);w.style.left=ox+cx-sx+'px';w.style.top=oy+cy-sy+'px';};
    const up=()=>{grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',up);
      const[px,py]=toPdf(P,parseFloat(w.style.left),parseFloat(w.style.top));a.x=px;a.y=py;};
    grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',up);
  });
  w.append(grip,tx);
  return w;
}
function focusText(id){const el=document.querySelector(`.tw[data-id="${id}"] .tx`);if(el){el.focus();}}

function bindAnnEvents(P){
  let draft=null;
  P.ann.addEventListener('pointerdown',e=>{
    if(e.button>0)return;
    const tool=S.tool;const[cx,cy]=localXY(P,e);
    if(tool==='text'){
      if(e.target.closest('.tw'))return;
      e.preventDefault();
      const size=S.size.text,wPt=220;
      const left=Math.max(4,cx-wPt*S.zoom),top=Math.max(0,cy-size*S.zoom*0.7);
      const[x,y]=toPdf(P,left,top);
      snapshot();
      const a={id:S.nextId++,type:'text',page:P.i-1,x,y,w:wPt,size,color:S.color.text,text:''};
      S.anns.push(a);P.tl.append(textEl(P,a));setTimeout(()=>focusText(a.id),0);
      return;
    }
    if(tool==='highlight'){
      e.preventDefault();P.ann.setPointerCapture(e.pointerId);
      const d=document.createElement('div');d.className='hl';d.style.background=S.color.highlight;P.hl.append(d);
      draft={kind:'hl',sx:cx,sy:cy,el:d};return;
    }
    if(tool==='pen'){
      e.preventDefault();P.ann.setPointerCapture(e.pointerId);
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('stroke',S.color.pen);p.setAttribute('stroke-width',S.size.pen*S.zoom);P.svg.append(p);
      draft={kind:'ink',pts:[[cx,cy]],el:p};p.setAttribute('d',`M${cx} ${cy} l0.1 0`);return;
    }
    if(tool==='eraser'){e.preventDefault();P.ann.setPointerCapture(e.pointerId);draft={kind:'erase'};eraseAt(e);}
  });
  P.ann.addEventListener('pointermove',e=>{
    if(!draft)return;const[cx,cy]=localXY(P,e);
    if(draft.kind==='hl'){Object.assign(draft.el.style,{left:Math.min(cx,draft.sx)+'px',top:Math.min(cy,draft.sy)+'px',width:Math.abs(cx-draft.sx)+'px',height:Math.abs(cy-draft.sy)+'px'});}
    else if(draft.kind==='ink'){const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs)draft.pts.push(localXY(P,ev));
      draft.el.setAttribute('d',draft.pts.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '));}
    else if(draft.kind==='erase')eraseAt(e);
  });
  const finish=e=>{
    if(!draft)return;const d=draft;draft=null;
    if(d.kind==='hl'){
      const[cx,cy]=localXY(P,e);d.el.remove();
      if(Math.abs(cx-d.sx)<3||Math.abs(cy-d.sy)<3)return;
      const[x1,y1]=toPdf(P,d.sx,d.sy),[x2,y2]=toPdf(P,cx,cy);
      snapshot();S.anns.push({id:S.nextId++,type:'hl',page:P.i-1,x1,y1,x2,y2,color:S.color.highlight});drawAnns(P);
    }else if(d.kind==='ink'){
      d.el.remove();
      const pts=simplify(d.pts,0.6).map(p=>toPdf(P,p[0],p[1]));
      snapshot();S.anns.push({id:S.nextId++,type:'ink',page:P.i-1,pts,w:S.size.pen,color:S.color.pen});drawAnns(P);
    }
  };
  P.ann.addEventListener('pointerup',finish);P.ann.addEventListener('pointercancel',finish);
}
function eraseAt(e){
  const els=document.elementsFromPoint(e.clientX,e.clientY);
  for(const el of els){const host=el.closest('[data-id]');if(host&&host.closest('.ann')){removeAnn(+host.dataset.id);return;}}
}
// light point thinning so long strokes stay small
function simplify(pts,tol){if(pts.length<3)return pts;const out=[pts[0]];for(let k=1;k<pts.length-1;k++){const p=out[out.length-1],q=pts[k];if(Math.hypot(q[0]-p[0],q[1]-p[1])>=tol)out.push(q);}out.push(pts[pts.length-1]);return out;}

/* ===================== save ===================== */
function hexRgb(h){const n=parseInt(h.slice(1),16);return PDFLib.rgb((n>>16&255)/255,(n>>8&255)/255,(n&255)/255);}
function b64Bytes(b){const s=atob(b);const u=new Uint8Array(s.length);for(let k=0;k<s.length;k++)u[k]=s.charCodeAt(k);return u;}
function wrapLines(text,font,size,maxW){
  const out=[];
  for(const para of text.split('\n')){
    const words=para.split(/(\s+)/);let line='';
    for(const w of words){
      const test=line+w;
      if(line&&font.widthOfTextAtSize(test.trimEnd(),size)>maxW+0.5){out.push(line.trimEnd());line=w.trimStart();}
      else line=test;
    }
    out.push(line.trimEnd());
  }
  return out;
}
async function buildPdf(){
  const{PDFDocument,BlendMode,LineCapStyle}=PDFLib;
  const doc=await PDFDocument.load(S.bytes,{ignoreEncryption:true});
  let font=null;
  if(S.anns.some(a=>a.type==='text')){doc.registerFontkit(fontkit);font=await doc.embedFont(b64Bytes(ALEF_B64),{subset:true});}
  const pages=doc.getPages();
  for(const a of S.anns){
    const pg=pages[a.page];if(!pg)continue;
    if(a.type==='hl'){
      pg.drawRectangle({x:Math.min(a.x1,a.x2),y:Math.min(a.y1,a.y2),width:Math.abs(a.x2-a.x1),height:Math.abs(a.y2-a.y1),color:hexRgb(a.color),opacity:.42,blendMode:BlendMode.Multiply});
    }else if(a.type==='ink'){
      const pts=a.pts.length===1?[a.pts[0],[a.pts[0][0]+.1,a.pts[0][1]]]:a.pts;
      const d=pts.map((p,k)=>(k?'L':'M')+p[0].toFixed(2)+' '+(-p[1]).toFixed(2)).join(' ');
      pg.pushOperators(PDFLib.pushGraphicsState(),PDFLib.setLineJoin(PDFLib.LineJoinStyle.Round));
      pg.drawSvgPath(d,{x:0,y:0,borderColor:hexRgb(a.color),borderWidth:a.w,borderLineCap:LineCapStyle.Round});
      pg.pushOperators(PDFLib.popGraphicsState());
    }else if(a.type==='text'&&a.text.trim()){
      const size=a.size,LH=size*1.35;
      const asc=font.heightAtSize(size,{descender:false}),full=font.heightAtSize(size);
      const lines=wrapLines(a.text,font,size,a.w);
      const firstStrong=[...a.text].find(c=>RE_R.test(c)||RE_L.test(c));
      const boxRtl=!firstStrong||RE_R.test(firstStrong);
      // lay the box out in on-screen units (scale 1), then map each run to PDF space;
      // this keeps text upright on rotated pages too
      const vp1=S.pages[a.page].page.getViewport({scale:1});
      const[bx,by]=vp1.convertToViewportPoint(a.x,a.y);
      const rot=PDFLib.degrees(vp1.rotation||0);
      lines.forEach((line,k)=>{
        if(!line)return;
        const{base,runs}=bidiRuns(line);
        const parts=runs.map(r=>{const s=runForPdf(r);return{s,w:font.widthOfTextAtSize(s,size)};});
        const total=parts.reduce((t,p)=>t+p.w,0);
        const rtl=line?base==='R':boxRtl; // unicode-bidi:plaintext => per-line direction
        let sx=rtl?bx+a.w-total:bx;
        const sy=by+k*LH+(LH-full)/2+asc;
        for(const p of parts){const[x,y]=vp1.convertToPdfPoint(sx,sy);pg.drawText(p.s,{x,y,size,font,color:hexRgb(a.color),rotate:rot});sx+=p.w;}
      });
    }
  }
  return doc.save();
}
const FS=!!(window.showSaveFilePicker&&window.showOpenFilePicker);
const PDF_TYPE=[{description:'PDF',accept:{'application/pdf':['.pdf']}}];
async function writeHandle(h,bytes){
  if(h.queryPermission&&(await h.queryPermission({mode:'readwrite'}))!=='granted'){
    if((await h.requestPermission({mode:'readwrite'}))!=='granted')throw new Error('אין הרשאה לכתוב לקובץ');}
  const w=await h.createWritable();await w.write(bytes);await w.close();
}
async function savePdf(saveAs){
  if(!S.bytes)return;
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
  busy(true,'שומר…');
  try{
    const out=await buildPdf();
    busy(false);
    if(FS&&S.handle&&!saveAs){await writeHandle(S.handle,out);setDirty(false);toast('נשמר: '+S.name);return;}
    const name=S.handle?S.name:S.name.replace(/\.pdf$/i,'')+' - ערוך.pdf';
    const r=await saveBytes(name,out,'pdf');
    if(r){if(r.handle){S.handle=r.handle;S.name=r.handle.name;$('fname').textContent=S.name;}setDirty(false);toast('הקובץ נשמר');}
  }catch(e){if(e&&e.name==='AbortError')return;console.error(e);toast('השמירה נכשלה: '+(e.message||e));}
  finally{busy(false);}
}
window.__buildPdf=buildPdf; // used by automated tests

// returns {handle} when saved through the file system, true when shared/downloaded, false when cancelled
async function saveBytes(name,bytes,kind){
  const isTxt=kind==='txt';
  if(FS){
    try{
      const h=await showSaveFilePicker({suggestedName:name,types:isTxt?[{description:'טקסט',accept:{'text/plain':['.txt']}}]:PDF_TYPE});
      await writeHandle(h,bytes);return isTxt?true:{handle:h};
    }catch(e){if(e&&e.name==='AbortError')return false;throw e;}
  }
  const type=isTxt?'text/plain':'application/pdf';
  const file=new File([bytes],name,{type});
  // phones: open the share sheet (save to Files, send by WhatsApp/mail…)
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true;}catch(e){if(e&&e.name==='AbortError')return false;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return true;
}

const LANG_HE={he:'עברית',en:'אנגלית',ar:'ערבית',ru:'רוסית',fr:'צרפתית',es:'ספרדית',de:'גרמנית',it:'איטלקית',pt:'פורטוגזית',am:'אמהרית',yi:'יידיש',uk:'אוקראינית',tr:'טורקית',zh:'סינית',ja:'יפנית',ko:'קוריאנית',pl:'פולנית',nl:'הולנדית',ro:'רומנית',hu:'הונגרית',fa:'פרסית',el:'יוונית',la:'לטינית'};
const TR={
  pages:[],target:'he',running:false,stop:false,src:null,
  reset(){this.pages=[];this.src=null;this.langFromApi=null;this.stop=true;$('tpResults').innerHTML='';$('tpFoot').classList.add('hidden');status('');$('tpLang').textContent='בודק…';}
};
function status(msg,err){const s=$('tpStatus');s.textContent=msg;s.classList.toggle('err',!!err);}

async function pageText(i){
  const P=S.pages[i];const tc=await P.page.getTextContent();
  let out='';
  for(const it of tc.items){if(!('str' in it))continue;out+=it.str;if(it.hasEOL)out+='\n';}
  return out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function detectLocal(text){
  const c={he:0,ar:0,ru:0,lat:0,cjk:0,el:0};
  for(const ch of text){
    if(/[\u0590-\u05FF]/.test(ch))c.he++;else if(/[\u0600-\u06FF]/.test(ch))c.ar++;
    else if(/[\u0400-\u04FF]/.test(ch))c.ru++;else if(/[\u0370-\u03FF]/.test(ch))c.el++;
    else if(/[\u3040-\u30FF\u4E00-\u9FFF\uAC00-\uD7AF]/.test(ch))c.cjk++;else if(/[A-Za-z\u00C0-\u024F]/.test(ch))c.lat++;
  }
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
  if(!top||top[1]<5)return null;
  if(top[0]!=='lat')return top[0]==='cjk'?'zh':top[0];
  const w=text.toLowerCase().match(/[a-z\u00e0-\u00ff]+/g)||[];
  const score=set=>w.filter(x=>set.has(x)).length;
  const sets={en:new Set('the and of to in is that for with as on are this be by it from or'.split(' ')),
    fr:new Set('le la les et des du un une est pour dans que qui sur pas au'.split(' ')),
    es:new Set('el la los las y de que en un una es por para con del se'.split(' ')),
    de:new Set('der die das und ist nicht mit den von zu ein eine auf für sich'.split(' '))};
  const best=Object.entries(sets).map(([k,v])=>[k,score(v)]).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>2?best[0]:'en';
}
async function detect(){
  if(!S.doc)return;
  let sample='';
  for(let i=0;i<Math.min(S.pages.length,3)&&sample.length<4000;i++)sample+=await pageText(i)+'\n';
  if(sample.replace(/\s/g,'').length<20){$('tpLang').textContent='לא נמצא טקסט (ייתכן שהקובץ סרוק)';TR.src=null;return;}
  TR.src=detectLocal(sample);
  $('tpLang').textContent=LANG_HE[TR.src]||TR.src||'לא ידועה';
  setTarget(TR.src==='he'?'en':'he');
}
function setTarget(t){TR.target=t;document.querySelectorAll('.segb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.target===t));}
function currentPageIndex(){const m=/(\d+)/.exec($('pageInfo').textContent);return m?+m[1]-1:0;}

function trSystem(target){
  const t=target==='en'?'English':'Hebrew';
  return `You are a professional document translator. Translate the page the user sends into ${t}.\nOutput format, exactly:\nLANG: <ISO 639-1 code of the source text's main language>\n---\n<the translation>\nKeep paragraph breaks, headings, list numbering, numbers, names and line structure. Output only the translation, with no notes or explanations. If the text is already in ${t}, return it unchanged.`;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function callTranslate(text,target){
  const st=loadST();const key=st.provider==='claude'?st.claudeKey:st.geminiKey;
  if(!key)return{error:'NO_KEY'};
  try{
    if(st.provider==='claude'){
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:st.model,max_tokens:8000,system:trSystem(target),messages:[{role:'user',content:`<page>\n${text}\n</page>`}]})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)return{error:(d.error&&d.error.message)||('HTTP '+r.status),status:r.status};
      return{raw:(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')};
    }
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(st.model)}:generateContent`;
    const body=JSON.stringify({systemInstruction:{parts:[{text:trSystem(target)}]},contents:[{role:'user',parts:[{text:`<page>\n${text}\n</page>`}]}],generationConfig:{temperature:0.2,maxOutputTokens:16384}});
    for(let attempt=0;attempt<5;attempt++){
      const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body});
      const d=await r.json().catch(()=>({}));
      if(r.status===429||r.status===503){
        if(/per ?day/i.test(JSON.stringify(d)))return{error:'DAILY_LIMIT',status:429};
        const info=((d.error&&d.error.details)||[]).find(x=>x.retryDelay);
        const wait=info?Math.min(60,parseFloat(info.retryDelay)||10):10*(attempt+1);
        status(`Gemini מבקש להמתין ${Math.round(wait)} שניות (מגבלת המסלול החינמי)…`);
        await sleep(wait*1000+500);continue;
      }
      if(!r.ok){const msg=(d.error&&d.error.message)||('HTTP '+r.status);return{error:msg,status:/API key not valid|API_KEY_INVALID/i.test(msg)?401:r.status};}
      const c=(d.candidates||[])[0];
      const out=c&&c.content&&(c.content.parts||[]).filter(x=>x.text&&!x.thought).map(x=>x.text).join('');
      return out?{raw:out}:{error:'EMPTY'};
    }
    return{error:'RATE_LIMIT',status:429};
  }catch(e){return{error:'NETWORK',detail:String(e)};}
}
function parseTr(raw){
  const m=/^\s*LANG:\s*([a-zA-Z-]{2,8})\s*\n\s*---\s*\n?/.exec(raw);
  return m?{lang:m[1].toLowerCase().slice(0,2),text:raw.slice(m[0].length).trim()}:{lang:null,text:raw.trim()};
}
function errText(r){
  if(r.error==='NO_KEY')return'צריך להזין מפתח API בהגדרות התרגום (⚙).';
  if(r.error==='NETWORK')return'אין חיבור לאינטרנט. התרגום דורש חיבור.';
  if(r.error==='DAILY_LIMIT')return'נגמרה המכסה היומית החינמית של Gemini. היא מתאפסת מחר בסביבות 10:00 בבוקר.';
  if(r.error==='RATE_LIMIT')return'Gemini עמוס כרגע. נסו שוב בעוד דקה.';
  if(r.error==='EMPTY')return'התקבלה תשובה ריקה לעמוד הזה. נסו לתרגם אותו שוב.';
  if(r.status===401)return'מפתח ה-API לא תקין. בדקו אותו בהגדרות (⚙).';
  if(r.status===403)return'הגישה נדחתה: '+r.error;
  if(r.status===429)return'יותר מדי בקשות. נסו שוב בעוד דקה.';
  if(r.status===400&&/credit|balance/i.test(r.error))return'אין מספיק קרדיט בחשבון ה-API.';
  return'שגיאה בתרגום: '+r.error;
}
function pageCard(i){
  let el=document.querySelector(`.tp-page[data-i="${i}"]`);
  if(!el){el=document.createElement('div');el.className='tp-page';el.dataset.i=i;
    el.innerHTML=`<h3>עמוד ${i+1}</h3><div class="tt wait" dir="auto">ממתין…</div>`;
    el.querySelector('h3').onclick=()=>S.pages[i].el.scrollIntoView({behavior:'smooth',block:'start'});
    const list=$('tpResults');const after=[...list.children].find(c=>+c.dataset.i>i);list.insertBefore(el,after||null);}
  return el.querySelector('.tt');
}
async function runTranslate(){
  if(TR.running||!S.doc)return;
  const st=await getSettingsSafe();
  if(!st.hasKey){openSettings(true);status('צריך להזין מפתח API לפני התרגום.',true);return;}
  const idx=$('tpScope').value==='cur'?[currentPageIndex()]:S.pages.map((_,i)=>i);
  TR.running=true;TR.stop=false;$('tpGo').disabled=true;$('tpStop').classList.remove('hidden');
  if($('tpScope').value==='all'){$('tpResults').innerHTML='';TR.pages=[];}
  idx.forEach(pageCard);
  let done=0,failed=null;const target=TR.target;
  const queue=idx.slice();
  const worker=async()=>{
    while(queue.length&&!TR.stop&&!failed){
      const i=queue.shift();const el=pageCard(i);
      const text=await pageText(i);
      if(text.replace(/\s/g,'').length<2){el.textContent='אין טקסט בעמוד הזה (ייתכן שהוא סרוק).';el.className='tt err';TR.pages[i]={text:'',target};done++;continue;}
      el.textContent='מתרגם…';
      const r=await callTranslate(text,target);
      if(r.error){el.textContent=errText(r);el.className='tt err';if(['NO_KEY','NETWORK','DAILY_LIMIT'].includes(r.error)||r.status===401||r.status===403||(r.status===400&&/credit|balance/i.test(r.error)))failed=r;continue;}
      const p=parseTr(r.raw);
      if(p.lang&&!TR.langFromApi){TR.langFromApi=p.lang;$('tpLang').textContent=LANG_HE[p.lang]||p.lang;}
      TR.pages[i]={text:p.text,target};el.textContent=p.text;el.className='tt';
      done++;status(`תורגמו ${done} מתוך ${idx.length} עמודים`);
    }
  };
  status(`מתרגם ${idx.length===1?'עמוד אחד':idx.length+' עמודים'}…`);
  // Gemini's free tier allows only a few requests a minute, so pages go one at a time
  await Promise.all(Array.from({length:st.provider==='claude'?3:1},worker));
  TR.running=false;$('tpGo').disabled=false;$('tpStop').classList.add('hidden');
  if(failed){status(errText(failed),true);if(failed.error==='NO_KEY'||failed.status===401)openSettings(true);}
  else if(TR.stop)status(`נעצר. תורגמו ${done} עמודים.`);
  else status(`התרגום הושלם (${done} עמודים).`);
  $('tpFoot').classList.toggle('hidden',!TR.pages.some(p=>p&&p.text));
}
function translatedPages(){return TR.pages.map((p,i)=>p&&p.text?{i,text:p.text}:null).filter(Boolean);}
function baseName(){return S.name.replace(/\.pdf$/i,'')+(TR.target==='en'?' - English':' - עברית');}

async function exportTranslationPdf(){
  const list=translatedPages();if(!list.length)return;
  busy(true,'יוצר PDF…');
  try{
    const{PDFDocument}=PDFLib;const doc=await PDFDocument.create();doc.registerFontkit(fontkit);
    const font=await doc.embedFont(b64Bytes(ALEF_B64),{subset:true});
    const W=595.28,H=841.89,M=56,size=12,LH=size*1.55,maxW=W-2*M;
    const asc=font.heightAtSize(size,{descender:false});
    const grey=PDFLib.rgb(.45,.47,.52),ink=PDFLib.rgb(.11,.14,.2);
    const drawLine=(pg,line,y,sz,color)=>{
      if(!line)return;const{base,runs}=bidiRuns(line);
      const parts=runs.map(r=>{const s=runForPdf(r);return{s,w:font.widthOfTextAtSize(s,sz)};});
      const tot=parts.reduce((t,p)=>t+p.w,0);let x=base==='R'?W-M-tot:M;
      for(const p of parts){pg.drawText(p.s,{x,y,size:sz,font,color});x+=p.w;}
    };
    for(const{i,text}of list){
      let pg=doc.addPage([W,H]);let y=H-M-asc;
      const header=`תרגום עמוד ${i+1} מתוך הקובץ ${S.name}`;
      drawLine(pg,header,y,9,grey);y-=LH*1.6;
      for(const line of wrapLines(text,font,size,maxW)){
        if(y<M){pg=doc.addPage([W,H]);y=H-M-asc;}
        drawLine(pg,line,y,size,ink);y-=LH;
      }
    }
    const out=await doc.save();busy(false);
    if(await saveBytes(baseName()+'.pdf',out,'pdf'))toast('התרגום נשמר כ-PDF');
  }catch(e){console.error(e);toast('יצירת ה-PDF נכשלה: '+(e.message||e));}
  finally{busy(false);}
}
function translationText(){return translatedPages().map(p=>`— עמוד ${p.i+1} —\n${p.text}`).join('\n\n');}
window.__exportTr=exportTranslationPdf;

function loadST(){
  let c={};try{c=JSON.parse(localStorage.getItem('siman.settings')||'{}');}catch(_){}
  const provider=c.provider==='claude'?'claude':'gemini';
  const model=(provider==='claude'?c.claudeModel:c.geminiModel)||PROVIDERS[provider].models[0][0];
  return{...c,provider,model,hasKey:!!(provider==='claude'?c.claudeKey:c.geminiKey),hasGeminiKey:!!c.geminiKey,hasClaudeKey:!!c.claudeKey};
}
function saveST(patch){
  let c={};try{c=JSON.parse(localStorage.getItem('siman.settings')||'{}');}catch(_){}
  c.provider=patch.provider;
  if(patch.provider==='claude'){c.claudeModel=patch.model;if(patch.apiKey)c.claudeKey=patch.apiKey;}
  else{c.geminiModel=patch.model;if(patch.apiKey)c.geminiKey=patch.apiKey;}
  try{localStorage.setItem('siman.settings',JSON.stringify(c));}catch(_){}
  return loadST();
}

  const ol=$('thumbs');ol.innerHTML='';if(!S.doc)return;
  const n=S.pages.length;
  S.pages.forEach((P,i)=>{
    const li=document.createElement('li');li.className='thumb';li.dataset.i=i;
    li.innerHTML=`<div class="tc" title="מעבר לעמוד ${i+1}"></div><span class="tl">${i+1}</span>
      <div class="ta"><button data-a="up" title="הזזה למעלה" aria-label="הזזת עמוד ${i+1} למעלה" ${i?'':'disabled'}>↑</button>
      <button data-a="down" title="הזזה למטה" aria-label="הזזת עמוד ${i+1} למטה" ${i<n-1?'':'disabled'}>↓</button>
      <button data-a="rot" title="סיבוב" aria-label="סיבוב עמוד ${i+1}">↻</button>
      <button data-a="del" class="del" title="מחיקה" aria-label="מחיקת עמוד ${i+1}" ${n>1?'':'disabled'}>🗑</button></div>`;
    ol.append(li);
  });
  markCurrentThumb();
  for(let i=0;i<n;i++){ // draw sequentially so big files stay responsive
    const P=S.pages[i];if(!P||!document.body.contains(ol))return;
    const vp=P.page.getViewport({scale:1});const sc=Math.min(130/vp.width,180/vp.height)*Math.min(devicePixelRatio||1,2);
    const v=P.page.getViewport({scale:sc});const c=document.createElement('canvas');c.width=Math.floor(v.width);c.height=Math.floor(v.height);
    c.style.width=Math.floor(v.width/Math.min(devicePixelRatio||1,2))+'px';
    try{await P.page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;}catch(_){continue;}
    const slot=ol.querySelector(`.thumb[data-i="${i}"] .tc`);if(slot){slot.innerHTML='';slot.append(c);}
  }
}
function markCurrentThumb(){const cur=currentPageIndex();document.querySelectorAll('.thumb').forEach(t=>t.classList.toggle('cur',+t.dataset.i===cur));}
$('thumbs').addEventListener('click',async e=>{
  const li=e.target.closest('.thumb');if(!li)return;const i=+li.dataset.i;
  const b=e.target.closest('button');
  if(!b){S.pages[i].el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  const n=S.pages.length;const order=[...Array(n).keys()].map(k=>({src:0,i:k,rot:0}));
  const a=b.dataset.a;
  if(a==='up'&&i>0)[order[i-1],order[i]]=[order[i],order[i-1]];
  else if(a==='down'&&i<n-1)[order[i+1],order[i]]=[order[i],order[i+1]];
  else if(a==='rot')order[i].rot=90;
  else if(a==='del'){const has=S.anns.some(x=>x.page===i);if(!confirm(`למחוק את עמוד ${i+1}${has?' יחד עם הסימונים שעליו':''}?`))return;order.splice(i,1);}
  else return;
  await rebuild(order,[]);
});
$('mergeBtn').onclick=()=>$('mergeFile').click();
$('mergeFile').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  const extra=[];for(const f of files)extra.push(new Uint8Array(await f.arrayBuffer()));
  const order=S.pages.map((_,k)=>({src:0,i:k,rot:0}));
  busy(true,'קורא את הקבצים…');
  try{for(let x=0;x<extra.length;x++){const d=await PDFLib.PDFDocument.load(extra[x],{ignoreEncryption:true});for(let k=0;k<d.getPageCount();k++)order.push({src:x+1,i:k,rot:0});}}
  catch(err){busy(false);toast('אחד הקבצים לא נפתח. ייתכן שהוא פגום או מוגן.');return;}
  busy(false);
  await rebuild(order,extra);toast(files.length>1?`נוספו ${files.length} קבצים`:'הקובץ נוסף לסוף המסמך');
};
// order: [{src:0|n, i, rot}] — src 0 is the open document, n>0 is extra[n-1]
async function rebuild(order,extra){
  busy(true,'מעדכן עמודים…');
  try{
    const{PDFDocument,degrees}=PDFLib;
    const docs=[await PDFDocument.load(S.bytes,{ignoreEncryption:true})];
    for(const b of extra)docs.push(await PDFDocument.load(b,{ignoreEncryption:true}));
    const out=await PDFDocument.create();
    for(const o of order){
      const[pg]=await out.copyPages(docs[o.src],[o.i]);
      if(o.rot)pg.setRotation(degrees(((pg.getRotation().angle||0)+o.rot)%360));
      out.addPage(pg);
    }
    const bytes=await out.save();
    const map=new Map();order.forEach((o,k)=>{if(o.src===0)map.set(o.i,k);});
    snapshot();
    S.anns=S.anns.filter(a=>map.has(a.page)).map(a=>({...a,page:map.get(a.page)}));
    S.hist=[];S.redo=[]; // page changes are not undoable; keep history consistent
    const keepTop=$('desk').scrollTop;
    const doc=await pdfjs.getDocument({data:bytes.slice(),isEvalSupported:false}).promise;
    if(S.doc)S.doc.destroy();
    S.doc=doc;S.bytes=new Uint8Array(bytes);setDirty(true);
    const z=S.zoom;await buildPages();S.zoom=z;layout();$('desk').scrollTop=keepTop;
    TR.reset();renderThumbs();
  }catch(e){console.error(e);toast('עדכון העמודים נכשל: '+(e.message||e));}
  finally{busy(false);}
}
$('pgBtn').onclick=()=>{const p=$('pgpanel');const show=p.classList.contains('hidden');p.classList.toggle('hidden',!show);if(show)renderThumbs();setTimeout(fitWidth,0);};
$('pgClose').onclick=()=>{$('pgpanel').classList.add('hidden');setTimeout(fitWidth,0);};
$('desk').addEventListener('scroll',()=>requestAnimationFrame(markCurrentThumb),{passive:true});

/* =====================================================================
   PWA — offline cache, install button, open PDFs from the OS
   ===================================================================== */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e));
}
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('installBtn').classList.remove('hidden');});
$('installBtn').onclick=async()=>{if(!installEvt)return;installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;$('installBtn').classList.add('hidden');if(r.outcome==='accepted')toast('סימן הותקן במכשיר');};
addEventListener('appinstalled',()=>$('installBtn').classList.add('hidden'));
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(isIOS&&!standalone)$('iosHint').classList.remove('hidden');
if('launchQueue' in window){
  launchQueue.setConsumer(async p=>{if(p.files&&p.files.length){const h=p.files[0];openFile(await h.getFile(),h);}});
}
</script>
